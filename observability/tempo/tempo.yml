server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 1m
  trace_idle_period: 10s
  flush_check_period: 10s

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05

query_frontend:
  search:
    default_result_limit: 20

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: lgtm-demo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      peer_attributes:
        - peer.service
        - server.address
        - net.peer.name
        - db.name
      dimensions:
        - service.namespace
        - messaging.system
      enable_client_server_prefix: true
      enable_virtual_node_label: true
    span_metrics:
      dimensions:
        - service.namespace
        - http.route
        - db.system
        - messaging.system
        - rpc.method
        - order.priority
        - customer.tier
        - customer.name
      enable_target_info: true
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
      complete_block_timeout: 30m

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
        - local-blocks
      collection_interval: 5s
