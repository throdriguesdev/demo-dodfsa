replicas: 1

tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Metrics generator: powers Service Graph, span RED metrics, and TraceQL
  # metrics (rate()/quantile_over_time via the local-blocks processor).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir.monitoring.svc.cluster.local:8080/api/v1/push"
    processor:
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks

persistence:
  enabled: true
  size: 10Gi

serviceMonitor:
  enabled: false
