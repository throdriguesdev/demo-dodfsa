  business.json: "{\n  \"annotations\": { \"list\": [] },\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"panels\": [\n    {\n      \"title\": \"KPIs\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Orders / min\",\n      \"description\": \"Rate of orders created per minute\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 0, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(orders_created_total{job=\\\"demo-api\\\"}[5m])) * 60\",\n          \"legendFormat\": \"orders/min\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Completion Rate %\",\n      \"description\": \"Percentage of created orders that are completed\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 6, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(orders_completed_total{job=\\\"demo-api\\\"}[5m])) / sum(rate(orders_created_total{job=\\\"demo-api\\\"}[5m])) * 100\",\n          \"legendFormat\": \"completion %\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 80 },\n              { \"color\": \"green\", \"value\": 90 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Revenue / min\",\n      \"description\": \"Revenue rate per minute\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 12, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(orders_revenue_total{job=\\\"demo-api\\\"}[5m])) * 60\",\n          \"legendFormat\": \"revenue/min\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Failed Orders\",\n      \"description\": \"Total number of failed orders\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 18, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(orders_failed_total{job=\\\"demo-api\\\"}) or vector(0)\",\n          \"legendFormat\": \"failed\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"red\", \"value\": 1 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Order Flow\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 5 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Orders Created / Completed / Failed / Cancelled per Minute\",\n      \"description\": \"Order lifecycle events over time\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 6 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(orders_created_total{job=\\\"demo-api\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"Created\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        },\n        {\n          \"expr\": \"sum(rate(orders_completed_total{job=\\\"demo-api\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"Completed\",\n          \"refId\": \"B\",\n          \"exemplar\": true\n        },\n        {\n          \"expr\": \"sum(rate(orders_failed_total{job=\\\"demo-api\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"Failed\",\n          \"refId\": \"C\",\n          \"exemplar\": true\n        },\n        {\n          \"expr\": \"sum(rate(orders_cancelled_total{job=\\\"demo-api\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"Cancelled\",\n          \"refId\": \"D\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 30,\n            \"stacking\": { \"mode\": \"normal\", \"group\": \"A\" },\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"none\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }\n      }\n    },\n    {\n      \"title\": \"Revenue by Product over Time\",\n      \"description\": \"Revenue rate per product per minute\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 6 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (product) (rate(orders_revenue_total{job=\\\"demo-api\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"{{product}}\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"currencyUSD\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }\n      }\n    },\n    {\n      \"title\": \"Products\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 14 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Orders by Product\",\n      \"description\": \"Order creation rate broken down by product\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 15 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (product) (rate(orders_created_total{job=\\\"demo-api\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{product}}\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\", \"calcs\": [\"mean\", \"max\", \"lastNotNull\"] }\n      }\n    },\n    {\n      \"title\": \"Inventory Levels\",\n      \"description\": \"Current stock levels per product\",\n      \"type\": \"bargauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 15 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"inventory_level{job=\\\"demo-api\\\"}\",\n          \"legendFormat\": \"{{product}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 5 },\n              { \"color\": \"green\", \"value\": 20 }\n            ]\n          },\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"orientation\": \"horizontal\",\n        \"displayMode\": \"gradient\",\n        \"showUnfilled\": true\n      }\n    },\n    {\n      \"title\": \"Payments\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 23 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Payments by Method\",\n      \"description\": \"Payment rate by payment method\",\n      \"type\": \"piechart\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 24 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (method) (rate(payments_total{job=\\\"demo-api\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{method}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"pieType\": \"pie\",\n        \"tooltip\": { \"mode\": \"single\" },\n        \"legend\": { \"displayMode\": \"table\", \"placement\": \"right\", \"calcs\": [\"percent\"] }\n      }\n    },\n    {\n      \"title\": \"Notifications by Status\",\n      \"description\": \"Notification send rate by status\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 24 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (status) (rate(notifications_sent_total{job=\\\"demo-api\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{status}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }\n      }\n    },\n    {\n      \"title\": \"Failures\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 32 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Failure Rate over Time\",\n      \"description\": \"Total order failure rate\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 33 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(orders_failed_total{job=\\\"demo-api\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"failures/s\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"ops\",\n          \"color\": { \"mode\": \"fixed\", \"fixedColor\": \"red\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"single\" },\n        \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }\n      }\n    },\n    {\n      \"title\": \"Failures by Reason\",\n      \"description\": \"Order failure rate broken down by reason\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 33 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (reason) (rate(orders_failed_total{job=\\\"demo-api\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{reason}}\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          },\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }\n      }\n    }\n  ],\n  \"refresh\": \"10s\",\n  \"schemaVersion\": 39,\n  \"tags\": [\"lgtm-demo\", \"business\"],\n  \"templating\": { \"list\": [] },\n  \"time\": { \"from\": \"now-30m\", \"to\": \"now\" },\n  \"timepicker\": {},\n  \"timezone\": \"\",\n  \"title\": \"Business \u2014 Orders & Revenue\",\n  \"uid\": \"business\",\n  \"version\": 1\n}"
  correlation.json: "{\n  \"annotations\": { \"list\": [] },\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"panels\": [\n    {\n      \"title\": \"RED Overview\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Request Rate\",\n      \"description\": \"Span-level calls/s for the selected service\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 0, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(traces_spanmetrics_calls_total{source=\\\"tempo\\\", service=\\\"${service:text}\\\"}[5m]))\",\n          \"legendFormat\": \"req/s\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Error Rate\",\n      \"description\": \"Percentage of spans with error status\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 6, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(traces_spanmetrics_calls_total{source=\\\"tempo\\\", service=\\\"${service:text}\\\", status_code=\\\"STATUS_CODE_ERROR\\\"}[5m])) / sum(rate(traces_spanmetrics_calls_total{source=\\\"tempo\\\", service=\\\"${service:text}\\\"}[5m])) * 100\",\n          \"legendFormat\": \"error %\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 5 },\n              { \"color\": \"red\", \"value\": 10 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"p95 Latency\",\n      \"description\": \"95th percentile span duration\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 12, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{source=\\\"tempo\\\", service=\\\"${service:text}\\\"}[5m])))\",\n          \"legendFormat\": \"p95\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 1 },\n              { \"color\": \"red\", \"value\": 3 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"p50 Latency\",\n      \"description\": \"Median span duration\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 6, \"x\": 18, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(traces_spanmetrics_latency_bucket{source=\\\"tempo\\\", service=\\\"${service:text}\\\"}[5m])))\",\n          \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 0.5 },\n              { \"color\": \"red\", \"value\": 2 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"title\": \"Three Pillars \u2014 Metrics \\u00b7 Logs \\u00b7 Traces\",\n      \"type\": \"row\",\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 5 },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"title\": \"Metrics \u2014 Error Rate over Time\",\n      \"description\": \"Error rate with exemplar dots. Click an exemplar to jump to the trace in Tempo.\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 12, \"w\": 8, \"x\": 0, \"y\": 6 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"mimir\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(traces_spanmetrics_calls_total{source=\\\"tempo\\\", service=\\\"${service:text}\\\", status_code=\\\"STATUS_CODE_ERROR\\\"}[5m]))\",\n          \"legendFormat\": \"errors/s\",\n          \"refId\": \"A\",\n          \"exemplar\": true\n        },\n        {\n          \"expr\": \"sum(