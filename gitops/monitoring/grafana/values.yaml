replicas: 1

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

adminUser: admin
admin:
  existingSecret: grafana-admin-secret
  userKey: username
  passwordKey: password

grafana.ini:
  server:
    root_url: https://grafana.lab.trdevops.com.br
  auth:
    # keep the login form so you can still sign in as admin during the demo
    disable_login_form: false
  # public access: anyone with the URL gets full interactive access, no login
  auth.anonymous:
    enabled: true
    org_name: Main Org.
    org_role: Editor
    hide_version: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        uid: mimir
        url: http://mimir.monitoring.svc.cluster.local:8080/prometheus
        isDefault: true
        jsonData:
          timeInterval: 60s

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: mimir
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:075472844803:certificate/aaba3efe-95bb-4629-8f4c-55bcecd9ee81
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: grafana.lab.trdevops.com.br
  hosts:
    - grafana.lab.trdevops.com.br
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.lab.trdevops.com.br
