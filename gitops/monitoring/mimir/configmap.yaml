apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  config.yaml: |
    target: all,compactor
    multitenancy_enabled: false

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/common

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        replication_factor: 1

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/rules

    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
