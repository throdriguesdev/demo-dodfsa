apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/job: "payment-gateway"
        k8s.grafana.com/metrics.portNumber: "9092"
        k8s.grafana.com/metrics.path: "/metrics"
    spec:
      containers:
        - name: payment-gateway
          image: 075472844803.dkr.ecr.us-east-1.amazonaws.com/demo-grafana-payment-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9092
          env:
            - name: OTEL_SERVICE_NAME
              value: payment-gateway
          envFrom:
            - configMapRef:
                name: app-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: demo-app
spec:
  selector:
    app: payment-gateway
  ports:
    - port: 9092
      targetPort: 9092
