apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 5.7.0
    helm:
      valuesObject:
        # Single-replica minimal deployment — swap for distributed values in production
        global:
          extraEnvFrom: []

        mimir:
          structuredConfig:
            common:
              storage:
                backend: filesystem
                filesystem:
                  dir: /data
            blocks_storage:
              backend: filesystem
              filesystem:
                dir: /data/blocks
            ingester:
              ring:
                replication_factor: 1
            multitenancy_enabled: false

        alertmanager:
          enabled: false
        ruler:
          enabled: false
        overrides_exporter:
          enabled: false
        rollout_operator:
          enabled: false

        distributor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        ingester:
          replicas: 1
          persistentVolume:
            size: 20Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi

        querier:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        query_frontend:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        query_scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        store_gateway:
          replicas: 1
          persistentVolume:
            size: 10Gi
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

        compactor:
          replicas: 1
          persistentVolume:
            size: 10Gi
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

        gateway:
          enabled: true
          replicas: 1
          nginx:
            enabled: false

        minio:
          enabled: false

        metaMonitoring:
          dashboards:
            enabled: false
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
