apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-secret
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/throdriguesdev/demo-dodfsa.git
    targetRevision: HEAD
    path: gitops/monitoring/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
