apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/throdriguesdev/demo-dodfsa.git
      targetRevision: HEAD
      path: gitops/system/grafana
    - repoURL: https://github.com/throdriguesdev/demo-dodfsa.git
      targetRevision: HEAD
      path: gitops/system/alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
